<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- The sofa seen from behind, with the backs of Cleo's (left) and the brown cat's (right) heads.
       Same 1024x1024 frame as sofa.png so the two line up when the sofa turns around.
       app.js zooms in on this so only the top of the heads stays in view. If the heads move or
       change size, update HEAD_WIDTH and EAR_TOP in app.js (both are fractions of this frame):
       each head is 218 wide, the ear tips sit at y = 296, and the pair is centred on x = 512. -->
  <g stroke="#141414" stroke-width="19" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cleo (cream), seen from behind -->
    <path transform="translate(263 294) scale(0.42)" d="M66 118 L92 14 L186 74 Q260 58 334 74 L428 14 L454 118 Q496 190 486 300 L486 420 L34 420 L34 300 Q24 190 66 118 Z" fill="#f9dca8"/>
    <!-- Brown cat, seen from behind -->
    <path transform="translate(543 294) scale(0.42)" d="M66 118 L92 14 L186 74 Q260 58 334 74 L428 14 L454 118 Q496 190 486 300 L486 420 L34 420 L34 300 Q24 190 66 118 Z" fill="#4a2817"/>
  </g>
  <g stroke="#141414" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Legs -->
    <rect x="150" y="830" width="34" height="56" rx="4" fill="#4a2817"/>
    <rect x="430" y="830" width="34" height="56" rx="4" fill="#4a2817"/>
    <rect x="610" y="830" width="34" height="56" rx="4" fill="#4a2817"/>
    <rect x="840" y="830" width="34" height="56" rx="4" fill="#4a2817"/>
    <!-- Arms -->
    <rect x="76" y="560" width="96" height="276" rx="16" fill="#b02e15"/>
    <rect x="852" y="560" width="96" height="276" rx="16" fill="#b02e15"/>
    <!-- Back panel -->
    <rect x="134" y="452" width="756" height="390" rx="24" fill="#c9381c"/>
    <!-- Seam between the two back cushions -->
    <path d="M512 470 L512 826" fill="none" stroke-width="6"/>
    <!-- Base band -->
    <path d="M140 770 L884 770" fill="none" stroke-width="6"/>
  </g>
</svg>
