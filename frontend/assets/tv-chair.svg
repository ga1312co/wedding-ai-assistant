<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- The dark blue armchair with its chrome foot, drawn whole -->
