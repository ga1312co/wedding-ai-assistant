<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="public/cleo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cleos bröllopshörna</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Login Page -->
    <div id="login-container" class="login-container">
      <div class="login-form-container">
        <span id="typewriter-title" class="typewriter-text"></span>
        <form id="login-form" class="login-form">
          <input id="last-name" type="text" required placeholder="Skriv ditt efternamn..." autocomplete="family-name" maxlength="100" />
          <p id="error-message" class="error-message" style="display: none;"></p>
        </form>
      </div>
      <img src="assets/church-front.png" alt="S:t Johannes kyrka" class="church-image" />
    </div>

    <!-- Room (hidden until login). The camera orbits 180° around the sofa to end up just behind the cats, facing the TV. -->
    <div id="room" class="room" hidden>
      <!-- The room as a panorama strip: wall behind the sofa | side wall | TV wall. It sweeps sideways during the orbit. -->
      <div id="backdrop" class="backdrop">
        <section class="wall"></section>
        <section class="wall wall-side"></section>
        <section class="wall wall-tv">
          <!-- TV, wall mounted. Sits before the furniture so the lamp and candlesticks overlap its lower edge. -->
          <div id="tv" class="tv">
            <div class="tv-frame">
              <div id="tv-screen" class="tv-screen">
                <img class="slide" alt="" referrerpolicy="no-referrer" />
                <img class="slide" alt="" referrerpolicy="no-referrer" />
                <p id="tv-message" class="tv-message">Laddar bilder...</p>
                <div id="rotate-hint" class="rotate-hint" role="status">
                  <svg class="rotate-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect><path d="M11 18.5 L13 18.5"></path></svg>
                  Vrid telefonen
                </div>
                <div class="tv-controls">
                  <button id="prev-button" class="tv-button" type="button" aria-label="Föregående bild">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4 L6.5 10 L12.5 16"></path></svg>
                  </button>
                  <button id="play-button" class="tv-button" type="button" aria-label="Pausa">
                    <svg class="icon-pause" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 5 L7 15 M13 5 L13 15"></path></svg>
                    <svg class="icon-play" viewBox="0 0 20 20" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5 L15 10 L7.5 15 Z"></path></svg>
                  </button>
                  <span id="tv-counter" class="tv-counter"></span>
                  <button id="next-button" class="tv-button" type="button" aria-label="Nästa bild">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4 L13.5 10 L7.5 16"></path></svg>
                  </button>
                  <a id="download-button" class="tv-button tv-button-spaced" aria-label="Ladda ner bilden" target="_blank" rel="noopener" hidden>
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 L10 12 M6 8.5 L10 12.5 L14 8.5 M4 16.5 L16 16.5"></path></svg>
                  </a>
                  <button id="enlarge-button" class="tv-button" type="button" aria-label="Förstora" aria-pressed="false">
                    <svg class="icon-enlarge" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8 L4 4 L8 4 M12 4 L16 4 L16 8 M16 12 L16 16 L12 16 M8 16 L4 16 L4 12"></path></svg>
                    <svg class="icon-shrink" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4 L8 8 L4 8 M12 4 L12 8 L16 8 M16 12 L12 12 L12 16 M4 12 L8 12 L8 16"></path></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- The living room under the TV: sideboard with plant, candles, candlesticks and lamp; speaker and armchair on wide screens -->
          <div class="tv-scene" aria-hidden="true">
            <div class="scene-item sun-floor"></div>
            <img class="scene-item chair" src="assets/tv-chair.svg" alt="" />
            <div class="scene-item sideboard">
              <div class="sideboard-leg sideboard-leg-left"></div>
              <div class="sideboard-leg sideboard-leg-right"></div>
              <div class="sideboard-body">
                <div class="sideboard-sun"></div>
                <span class="seam seam-top"></span>
                <span class="seam seam-1"></span>
                <span class="seam seam-2"></span>
                <span class="seam seam-3"></span>
                <span class="seam seam-4"></span>
              </div>
            </div>
            <img class="scene-item plant" src="assets/tv-plant.svg" alt="" />
            <img class="scene-item candles" src="assets/tv-candles.svg" alt="" />
            <img class="scene-item candlesticks" src="assets/tv-candlesticks.svg" alt="" />
            <img class="scene-item lamp" src="assets/tv-lamp.svg" alt="" />
            <!-- Empty speaker box with the router on top; the music player (#music-player) is laid over its front -->
            <div class="speaker"></div>
          </div>

          <!-- Dims the room while the TV is enlarged (wide screens only) -->
          <div class="room-dim"></div>
        </section>
      </div>

      <!-- The sofa turns around its own axis: front (Cleo) on one side, the back of the cats' heads on the other -->
      <div id="sofa-scene" class="sofa-scene">
        <div id="sofa-card" class="sofa-card">
          <div class="sofa-face sofa-front">
            <img src="assets/sofa.png" alt="Soffa" class="sofa-image" />
            <!-- Pytte (the brown cat is part of sofa.png) asks the question, with the answers inside the bubble -->
            <div id="pytte-bubble" class="cat-bubble pytte-bubble">
              <span id="pytte-bubble-text" class="cat-bubble-text"></span>
              <div id="choices" class="choices">
                <button id="yes-button" class="choice-button choice-yes" type="button">Ja</button>
                <button id="no-button" class="choice-button choice-no" type="button">Nej</button>
              </div>
            </div>
            <div id="cleo" class="cleo">
              <div id="cleo-bubble" class="cat-bubble cleo-bubble" aria-live="polite">
                <span id="cleo-bubble-text" class="cat-bubble-text"></span>
              </div>
              <img id="cleo-image" src="assets/cleo.png" alt="Cleo" class="cleo-image" />
            </div>
          </div>
          <div class="sofa-face sofa-back">
            <img src="assets/sofa-back.svg" alt="" class="sofa-image" />
          </div>
        </div>
      </div>

      <!-- Chat with Cleo, under the sofa. Shown once the guest has answered Pytte. -->
      <div id="chat" class="chat">
        <div id="user-bubble" class="user-bubble">
          <span id="user-bubble-content"></span>
        </div>
        <form id="chat-form" class="chat-row">
          <button id="photos-button" class="chat-round-button" type="button" aria-label="Se bilderna">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"></rect><circle cx="7.5" cy="8" r="1.5"></circle><path d="M2.5 14 L7.5 10 L11 13 L13.5 11 L17.5 14.5"></path></svg>
          </button>
          <button id="history-button" class="chat-round-button" type="button" aria-label="Visa konversationen" hidden>
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6 L16 6 M4 10 L16 10 M4 14 L16 14"></path></svg>
          </button>
          <div class="chat-input-area">
            <input id="chat-input" type="text" maxlength="500" autocomplete="off" placeholder="Skriv en hälsning..." aria-label="Meddelande till Cleo" />
            <button id="send-button" type="submit" aria-label="Skicka">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10 L16 10 M11 5 L16 10 L11 15"></path></svg>
            </button>
          </div>
        </form>
      </div>

      <!-- The whole conversation, opened from the history button -->
      <div id="chat-history" class="chat-history" hidden>
        <div class="chat-history-card" role="dialog" aria-modal="true" aria-labelledby="chat-history-title">
          <div class="chat-history-header">
            <h2 id="chat-history-title">Konversationen</h2>
            <button id="chat-history-close" class="chat-history-close" type="button" aria-label="Stäng">✕</button>
          </div>
          <div id="history-messages" class="history-messages"></div>
        </div>
      </div>

      <button id="back-button" class="back-button" type="button" aria-label="Tillbaka till Cleo" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4 L6.5 10 L12.5 16"></path></svg>
        <span class="back-label">Tillbaka till Cleo</span>
      </button>

      <!-- Phones: the music player stays hidden until this is tapped -->
      <button id="music-button" class="music-button" type="button" aria-label="Visa musikspelaren" aria-expanded="false" aria-controls="music-player" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 15.5 L8 4.5 L16 3 L16 14"></path><circle cx="5.5" cy="15.5" r="2.5"></circle><circle cx="13.5" cy="14" r="2.5"></circle></svg>
      </button>

      <!-- Music player for assets/natteravn.mp3. One element for every layout:
           wide screens lay it over the speaker, phones drop it down from the music button. -->
      <div id="music-player" class="music-player">
        <audio id="song" src="assets/natteravn.mp3" preload="metadata"></audio>
        <button id="song-toggle" class="song-toggle" type="button" aria-label="Spela musiken">
          <svg class="icon-play" viewBox="0 0 20 20" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5 L15 10 L7.5 15 Z"></path></svg>
          <svg class="icon-pause" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 5 L7 15 M13 5 L13 15"></path></svg>
        </button>
        <div class="song-info">
          <span class="song-title">Natteravn</span>
          <span class="song-artist">Rasmus Seebach</span>
        </div>
        <input id="song-seek" class="song-seek" type="range" min="0" max="100" step="1" value="0" aria-label="Position i låten" />
        <span id="song-time" class="song-time">0:00</span>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
