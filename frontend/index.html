<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="public/cleo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cleos bröllopshörna</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Login Page -->
    <div id="login-container" class="login-container">
      <div class="login-form-container">
        <span id="typewriter-title" class="typewriter-text"></span>
        <form id="login-form" class="login-form">
          <input id="last-name" type="text" required placeholder="Skriv ditt efternamn..." autocomplete="family-name" maxlength="100" />
          <p id="error-message" class="error-message" style="display: none;"></p>
        </form>
      </div>
      <img src="assets/church-front.png" alt="S:t Johannes kyrka" class="church-image" />
    </div>

    <!-- Room (hidden until login). The camera orbits 180° around the sofa to end up behind the cats, facing the TV. -->
    <div id="room" class="room" hidden>
      <!-- The room as a panorama strip: wall behind the sofa | side wall | TV wall. It sweeps sideways during the orbit. -->
      <div id="backdrop" class="backdrop">
        <section class="wall"></section>
        <section class="wall wall-side"></section>
        <section class="wall wall-tv">
          <div id="tv" class="tv">
            <div id="tv-screen" class="tv-screen">
              <img class="slide" alt="" referrerpolicy="no-referrer" />
              <img class="slide" alt="" referrerpolicy="no-referrer" />
              <p id="tv-message" class="tv-message">Laddar bilder...</p>
              <div class="tv-controls">
                <button id="prev-button" type="button" aria-label="Föregående bild">‹</button>
                <button id="play-button" type="button" aria-label="Pausa">❚❚</button>
                <span id="tv-counter" class="tv-counter"></span>
                <button id="next-button" type="button" aria-label="Nästa bild">›</button>
              </div>
            </div>
          </div>
        </section>
        <div class="floor"></div>
      </div>

      <!-- The sofa turns around its own axis: front (Cleo) on one side, the back of the cats' heads on the other -->
      <div class="sofa-scene">
        <div id="sofa-card" class="sofa-card">
          <div class="sofa-face sofa-front">
            <img src="assets/sofa.png" alt="Soffa" class="sofa-image" />
            <div id="cleo" class="cleo">
              <div id="cleo-bubble" class="cleo-bubble">
                <span id="cleo-bubble-text"></span>
              </div>
              <img id="cleo-image" src="assets/cleo.png" alt="Cleo" class="cleo-image" />
            </div>
          </div>
          <div class="sofa-face sofa-back">
            <img src="assets/sofa-back.svg" alt="" class="sofa-image" />
          </div>
        </div>
        <div id="choices" class="choices">
          <button id="yes-button" class="choice-button choice-yes" type="button">Ja</button>
          <button id="no-button" class="choice-button choice-no" type="button">Nej</button>
          <button id="wake-button" class="choice-button choice-yes" type="button" hidden>Väck Cleo</button>
        </div>
      </div>

      <button id="back-button" class="back-button" type="button" hidden>‹ Tillbaka till Cleo</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
